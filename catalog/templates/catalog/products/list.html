{% extends 'catalog/index.html' %}

{% block title %}Товары{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-boxes"></i> Товары
        {% if total_count %}({{ total_count }}){% endif %}
    </h2>
    {% if user.is_authenticated %}
        <div class="btn-group">
            <a href="{% url 'catalog:client_page' %}" class="btn btn-info btn-sm me-2">
                <i class="bi bi-person"></i> Личный кабинет
            </a>
            {% if user.is_staff %}
                <a href="{% url 'catalog:manager_page' %}" class="btn btn-success btn-sm me-2">
                    <i class="bi bi-gear"></i> Менеджер
                </a>
            {% endif %}
            <a href="{% url 'catalog:product_create' %}" class="btn btn-success">
                <i class="bi bi-plus-lg"></i> Добавить товар
            </a>
        </div>
    {% endif %}
</div>

<!-- Форма поиска БЕЗ ИЗМЕНЕНИЙ -->
<form method="get" class="row g-3 mb-4">
    <!-- Твоя форма остается как есть -->
</form>

<!-- Твоя таблица БЕЗ ИЗМЕНЕНИЙ -->
<div class="table-responsive">
    <!-- Твоя таблица товаров остается полностью без изменений -->
</div>

<!-- Пагинация БЕЗ ИЗМЕНЕНИЙ -->
{% endblock %}
